<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Potree Sample LAS Top View</title>

	<link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">

	<style>
		#status_panel {
			position: absolute;
			top: 12px;
			left: 12px;
			z-index: 1000;
			max-width: 620px;
			padding: 10px 12px;
			background: rgba(0, 0, 0, 0.55);
			color: #fff;
			font: 12px/1.4 monospace;
			border-radius: 6px;
		}

		#btn_top_view {
			margin-top: 8px;
			padding: 4px 8px;
			cursor: pointer;
		}

		#label_panel {
			position: absolute;
			top: 12px;
			right: 12px;
			z-index: 1000;
			width: min(360px, 48vw);
			max-height: 72vh;
			overflow: hidden;
			padding: 10px 12px;
			background: rgba(0, 0, 0, 0.55);
			color: #fff;
			font: 12px/1.4 monospace;
			border-radius: 6px;
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		#label_panel_header {
			font-weight: 700;
		}

		#label_panel_meta {
			font-size: 11px;
			opacity: 0.9;
			white-space: pre-wrap;
		}

		#label_legend_body {
			overflow: auto;
			padding-right: 4px;
		}

		.label_row {
			display: grid;
			grid-template-columns: auto 1fr auto;
			gap: 8px;
			align-items: center;
			margin-bottom: 6px;
		}

		.label_toggle {
			margin: 0;
		}

		.label_name {
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.label_count {
			opacity: 0.85;
		}

		.label_color_button {
			display: inline-block;
			width: 26px;
			height: 18px;
			border: 1px solid rgba(255, 255, 255, 0.65);
			border-radius: 4px;
			cursor: pointer;
			padding: 0;
			background: transparent;
		}

		.label_color_input {
			position: absolute;
			opacity: 0;
			pointer-events: none;
			width: 1px;
			height: 1px;
		}

		.label_message {
			opacity: 0.95;
		}

		@media (max-width: 1024px) {
			#label_panel {
				width: min(380px, 62vw);
				max-height: 58vh;
			}
		}

		@media (max-width: 720px) {
			#status_panel,
			#label_panel {
				left: 10px;
				right: 10px;
				width: auto;
				max-width: none;
			}

			#label_panel {
				top: auto;
				bottom: 10px;
				max-height: 42vh;
			}
		}
	</style>
</head>

<body>
	<script src="../libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../libs/spectrum/spectrum.js"></script>
	<script src="../libs/jquery-ui/jquery-ui.min.js"></script>

	<script src="../libs/other/BinaryHeap.js"></script>
	<script src="../libs/tween/tween.min.js"></script>
	<script src="../libs/d3/d3.js"></script>
	<script src="../libs/proj4/proj4.js"></script>
	<script src="../libs/openlayers3/ol.js"></script>
	<script src="../libs/i18next/i18next.js"></script>
	<script src="../libs/jstree/jstree.js"></script>
	<script src="../build/potree/potree.js"></script>
	<script src="../libs/plasio/js/laslaz.js"></script>

	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0; top: 0;">
		<div id="potree_render_area" style="background-image: url('../build/potree/resources/images/background.jpg');"></div>
		<div id="potree_sidebar_container"></div>
	</div>

	<div id="status_panel">
		<div id="status_text">Initializing...</div>
		<button id="btn_top_view" type="button">Top View</button>
	</div>

	<div id="label_panel">
		<div id="label_panel_header">Labels</div>
		<div id="label_panel_meta">Loading label map...</div>
		<div id="label_legend_body">
			<div class="label_message">Loading...</div>
		</div>
	</div>

	<script type="module">
		import * as THREE from "../libs/three.js/build/three.module.js";

		const params = new URLSearchParams(window.location.search);
		const samplePath = params.get("file") || "../data/sample.las";
		const labelMapPath = params.get("labelMap") || "../data/sample_labels.xml";
		const maxPointsParam = Number(params.get("maxPoints") || "0");
		const maxReadPointsParam = Number(params.get("maxReadPoints") || "0");
		const pointSize = Number(params.get("pointSize") || "0.015");
		const chunkPoints = Math.max(50000, Number(params.get("chunkPoints") || "1000000"));

		const pointLimit = Number.isFinite(maxPointsParam) && maxPointsParam > 0
			? Math.floor(maxPointsParam)
			: 0;
		const readLimit = Number.isFinite(maxReadPointsParam) && maxReadPointsParam > 0
			? Math.floor(maxReadPointsParam)
			: 0;
		const fullRenderMode = pointLimit === 0;
		const fullReadMode = readLimit === 0;

		const statusText = document.getElementById("status_text");
		const topViewButton = document.getElementById("btn_top_view");
		const labelPanelMeta = document.getElementById("label_panel_meta");
		const labelLegendBody = document.getElementById("label_legend_body");
		const fmt = new Intl.NumberFormat("en-US");

		function setStatus(text){
			statusText.textContent = text;
		}

		function setLabelPanelMeta(text){
			labelPanelMeta.textContent = text;
		}

		function setLabelLegendMessage(text){
			labelLegendBody.innerHTML = "";
			const message = document.createElement("div");
			message.className = "label_message";
			message.textContent = text;
			labelLegendBody.appendChild(message);
		}

		function concatUint8(left, right){
			if (left.length === 0) return right;
			if (right.length === 0) return left;
			const out = new Uint8Array(left.length + right.length);
			out.set(left, 0);
			out.set(right, left.length);
			return out;
		}

		function updateBounds(bounds, x, y, z){
			if (x < bounds.minX) bounds.minX = x;
			if (y < bounds.minY) bounds.minY = y;
			if (z < bounds.minZ) bounds.minZ = z;
			if (x > bounds.maxX) bounds.maxX = x;
			if (y > bounds.maxY) bounds.maxY = y;
			if (z > bounds.maxZ) bounds.maxZ = z;
		}

		function toRangeString(minValue, maxValue){
			return `[${minValue.toFixed(3)}, ${maxValue.toFixed(3)}]`;
		}

		function applyTopView(viewer, bounds){
			const centerX = (bounds.minX + bounds.maxX) / 2;
			const centerY = (bounds.minY + bounds.maxY) / 2;
			const centerZ = (bounds.minZ + bounds.maxZ) / 2;
			const spanX = Math.max(1, bounds.maxX - bounds.minX);
			const spanY = Math.max(1, bounds.maxY - bounds.minY);
			const spanZ = Math.max(1, bounds.maxZ - bounds.minZ);
			const distance = Math.max(spanX, spanY, spanZ) * 2.2;

			viewer.scene.view.position.set(centerX, centerY, centerZ + distance);
			viewer.scene.view.lookAt(new THREE.Vector3(centerX, centerY, centerZ));
		}

		function createPlane(bounds){
			const width = Math.max(0.5, bounds.maxX - bounds.minX) * 1.1;
			const height = Math.max(0.5, bounds.maxY - bounds.minY) * 1.1;
			const centerX = (bounds.minX + bounds.maxX) / 2;
			const centerY = (bounds.minY + bounds.maxY) / 2;
			const planeZ = bounds.minZ - Math.max(0.01, (bounds.maxZ - bounds.minZ) * 0.05);

			const geometry = new THREE.PlaneGeometry(width, height);
			const material = new THREE.MeshBasicMaterial({
				color: 0x2b7a78,
				transparent: true,
				opacity: 0.35,
				side: THREE.DoubleSide
			});

			const plane = new THREE.Mesh(geometry, material);
			plane.position.set(centerX, centerY, planeZ);
			plane.name = "custom_base_plane";

			return plane;
		}

		function parseLasHeader(buffer){
			if (buffer.length < 227) {
				return null;
			}

			const dv = new DataView(buffer.buffer, buffer.byteOffset, buffer.byteLength);
			const signature = String.fromCharCode(buffer[0], buffer[1], buffer[2], buffer[3]);
			if (signature !== "LASF") {
				throw new Error("Invalid LAS signature. Expected LASF.");
			}

			const versionMajor = dv.getUint8(24);
			const versionMinor = dv.getUint8(25);
			const headerSize = dv.getUint16(94, true);
			const offsetToPointData = dv.getUint32(96, true);
			const pointFormatRaw = dv.getUint8(104);
			const pointFormat = pointFormatRaw & 0x3f;
			const pointRecordLength = dv.getUint16(105, true);
			const legacyPointCount = dv.getUint32(107, true);

			if (buffer.length < headerSize) {
				return {
					version: `${versionMajor}.${versionMinor}`,
					headerSize,
					offsetToPointData,
					pointFormat,
					pointRecordLength,
					pointCount: legacyPointCount,
					scaleX: 0.001,
					scaleY: 0.001,
					scaleZ: 0.001,
					offsetX: 0,
					offsetY: 0,
					offsetZ: 0
				};
			}

			const scaleX = dv.getFloat64(131, true);
			const scaleY = dv.getFloat64(139, true);
			const scaleZ = dv.getFloat64(147, true);
			const offsetX = dv.getFloat64(155, true);
			const offsetY = dv.getFloat64(163, true);
			const offsetZ = dv.getFloat64(171, true);

			let pointCount = legacyPointCount;
			const supportsPointCount64 = versionMajor > 1 || (versionMajor === 1 && versionMinor >= 4);
			if (supportsPointCount64 && buffer.length >= 255) {
				const count64 = Number(dv.getBigUint64(247, true));
				if (count64 > 0) {
					pointCount = count64;
				}
			}

			return {
				version: `${versionMajor}.${versionMinor}`,
				headerSize,
				offsetToPointData,
				pointFormat,
				pointRecordLength,
				pointCount,
				scaleX,
				scaleY,
				scaleZ,
				offsetX,
				offsetY,
				offsetZ
			};
		}

		function getClassificationOffset(pointFormat){
			if (pointFormat >= 0 && pointFormat <= 5) {
				return 15;
			}
			if (pointFormat >= 6 && pointFormat <= 10) {
				return 16;
			}
			return -1;
		}

		function parseVisibility(value, fallback = true){
			if (value === null || value === undefined) {
				return fallback;
			}
			const normalized = String(value).trim().toLowerCase();
			if (normalized === "") {
				return fallback;
			}
			if (normalized === "false" || normalized === "0" || normalized === "no" || normalized === "off") {
				return false;
			}
			if (normalized === "true" || normalized === "1" || normalized === "yes" || normalized === "on") {
				return true;
			}
			return fallback;
		}

		function normalizeHexColor(input, fallback){
			if (typeof input !== "string") {
				return fallback;
			}

			const trimmed = input.trim();
			if (/^#[0-9a-fA-F]{6}$/.test(trimmed)) {
				return `#${trimmed.slice(1).toLowerCase()}`;
			}
			if (/^#[0-9a-fA-F]{3}$/.test(trimmed)) {
				const r = trimmed[1];
				const g = trimmed[2];
				const b = trimmed[3];
				return `#${r}${r}${g}${g}${b}${b}`.toLowerCase();
			}

			return fallback;
		}

		function getDeterministicColorHex(labelId){
			const color = new THREE.Color();
			const hue = (((labelId % 256) + 256) % 256) * 53 % 360;
			color.setHSL(hue / 360, 0.68, 0.52);
			return `#${color.getHexString()}`;
		}

		function createFallbackLabelDefinition(labelId){
			return {
				id: labelId,
				name: `Class ${labelId}`,
				color: getDeterministicColorHex(labelId),
				visible: true,
				source: "generated"
			};
		}

		async function loadLabelDefinitions(url){
			const definitions = new Map();

			try {
				const response = await fetch(url);
				if (!response.ok) {
					throw new Error(`Failed to fetch label map: ${response.status} ${response.statusText}`);
				}

				const xmlText = await response.text();
				const xml = new DOMParser().parseFromString(xmlText, "application/xml");
				if (xml.querySelector("parsererror")) {
					throw new Error("Label map XML parse error.");
				}

				const nodes = [
					...xml.querySelectorAll("Label"),
					...xml.querySelectorAll("label"),
					...xml.querySelectorAll("Class"),
					...xml.querySelectorAll("class")
				];

				for (const node of nodes) {
					const idRaw = node.getAttribute("id") ?? node.getAttribute("value");
					if (idRaw === null) {
						continue;
					}

					const id = Number(idRaw);
					if (!Number.isInteger(id) || id < 0 || id > 255) {
						continue;
					}

					const fallback = createFallbackLabelDefinition(id);
					const nameRaw =
						node.getAttribute("name") ??
						node.getAttribute("label") ??
						node.textContent ??
						"";
					const name = nameRaw.trim().length > 0 ? nameRaw.trim() : fallback.name;
					const color = normalizeHexColor(
						node.getAttribute("color") ?? node.getAttribute("hex") ?? "",
						fallback.color
					);
					const visible = parseVisibility(node.getAttribute("visible"), true);

					definitions.set(id, {
						id,
						name,
						color,
						visible,
						source: "xml"
					});
				}

				return {
					definitions,
					loadedFromXml: true,
					errorMessage: "",
					url
				};
			} catch (error) {
				console.warn(error);
				return {
					definitions,
					loadedFromXml: false,
					errorMessage: error.message,
					url
				};
			}
		}

		function createLabelChunkCollector(labelDefinition, chunkCapacity, pointSizeValue){
			const pointsGroup = new THREE.Group();
			pointsGroup.name = `sample_las_label_${labelDefinition.id}`;
			pointsGroup.visible = labelDefinition.visible;

			const material = new THREE.PointsMaterial({
				size: pointSizeValue,
				sizeAttenuation: true,
				color: new THREE.Color(labelDefinition.color)
			});

			let chunkIndex = 0;
			let chunkCount = 0;
			let writtenInChunk = 0;
			let renderedPoints = 0;
			let positions = new Float32Array(chunkCapacity * 3);

			function flushChunk(){
				if (writtenInChunk === 0) {
					return;
				}

				const geometry = new THREE.BufferGeometry();
				geometry.setAttribute(
					"position",
					new THREE.BufferAttribute(positions.subarray(0, writtenInChunk * 3), 3)
				);
				geometry.computeBoundingBox();
				geometry.computeBoundingSphere();

				const points = new THREE.Points(geometry, material);
				points.name = `sample_las_label_${labelDefinition.id}_chunk_${chunkIndex++}`;
				pointsGroup.add(points);

				renderedPoints += writtenInChunk;
				chunkCount++;
				writtenInChunk = 0;
				positions = new Float32Array(chunkCapacity * 3);
			}

			function appendPoint(x, y, z){
				if (writtenInChunk >= chunkCapacity) {
					flushChunk();
				}

				const i3 = writtenInChunk * 3;
				positions[i3 + 0] = x;
				positions[i3 + 1] = y;
				positions[i3 + 2] = z;
				writtenInChunk++;
			}

			function finalize(){
				flushChunk();
				return {
					renderedPoints,
					chunkCount
				};
			}

			function setVisible(value){
				pointsGroup.visible = !!value;
			}

			function isVisible(){
				return pointsGroup.visible;
			}

			function setColor(hexColor){
				material.color.set(hexColor);
			}

			function getColorHex(){
				return `#${material.color.getHexString()}`;
			}

			return {
				pointsGroup,
				appendPoint,
				finalize,
				setVisible,
				isVisible,
				setColor,
				getColorHex
			};
		}

		function createLabelPointCollector(chunkCapacity, pointSizeValue, labelDefinitions){
			const pointsGroup = new THREE.Group();
			pointsGroup.name = "sample_las_points_group";
			const labels = new Map();
			let bufferedPoints = 0;

			function getOrCreateLabel(labelId){
				if (labels.has(labelId)) {
					return labels.get(labelId);
				}

				if (!labelDefinitions.has(labelId)) {
					labelDefinitions.set(labelId, createFallbackLabelDefinition(labelId));
				}

				const definition = labelDefinitions.get(labelId);
				const collector = createLabelChunkCollector(definition, chunkCapacity, pointSizeValue);
				pointsGroup.add(collector.pointsGroup);

				const labelEntry = {
					id: labelId,
					definition,
					collector,
					seenPoints: 0
				};

				labels.set(labelId, labelEntry);
				return labelEntry;
			}

			function appendPoint(x, y, z, labelId){
				const label = getOrCreateLabel(labelId);
				label.collector.appendPoint(x, y, z);
				label.seenPoints++;
				bufferedPoints++;
			}

			function getBufferedPoints(){
				return bufferedPoints;
			}

			function getLabelCount(){
				return labels.size;
			}

			function finalize(){
				let renderedPoints = 0;
				let chunkCount = 0;
				const labelEntries = [];

				for (const [labelId, entry] of labels) {
					const finalized = entry.collector.finalize();
					renderedPoints += finalized.renderedPoints;
					chunkCount += finalized.chunkCount;

					labelEntries.push({
						id: labelId,
						name: entry.definition.name,
						color: entry.collector.getColorHex(),
						visible: entry.collector.isVisible(),
						seenPoints: entry.seenPoints,
						renderedPoints: finalized.renderedPoints,
						chunkCount: finalized.chunkCount,
						setVisible: (value) => entry.collector.setVisible(value),
						setColor: (hexColor) => entry.collector.setColor(hexColor)
					});
				}

				labelEntries.sort((a, b) => a.id - b.id);

				return {
					pointsGroup,
					renderedPoints,
					chunkCount,
					labelEntries
				};
			}

			return {
				appendPoint,
				getBufferedPoints,
				getLabelCount,
				finalize
			};
		}

		function renderLabelLegend(labelEntries){
			if (!labelEntries || labelEntries.length === 0) {
				setLabelLegendMessage("No labels detected in loaded points.");
				return;
			}

			labelLegendBody.innerHTML = "";

			for (const label of labelEntries) {
				const row = document.createElement("div");
				row.className = "label_row";

				const toggle = document.createElement("input");
				toggle.type = "checkbox";
				toggle.className = "label_toggle";
				toggle.checked = label.visible;
				toggle.addEventListener("change", () => {
					label.setVisible(toggle.checked);
				});

				const name = document.createElement("div");
				name.className = "label_name";
				name.title = `${label.name} (ID ${label.id})`;
				name.textContent = `${label.name} [${label.id}] `;

				const count = document.createElement("span");
				count.className = "label_count";
				count.textContent = `(${fmt.format(label.renderedPoints)})`;
				name.appendChild(count);

				const colorButton = document.createElement("button");
				colorButton.type = "button";
				colorButton.className = "label_color_button";
				colorButton.style.backgroundColor = label.color;
				colorButton.title = `Change color for ${label.name}`;

				const colorInput = document.createElement("input");
				colorInput.type = "color";
				colorInput.className = "label_color_input";
				colorInput.value = normalizeHexColor(label.color, "#ffffff");

				colorButton.addEventListener("click", () => {
					colorInput.click();
				});

				colorInput.addEventListener("input", () => {
					const next = normalizeHexColor(colorInput.value, label.color);
					label.color = next;
					label.setColor(next);
					colorButton.style.backgroundColor = next;
				});

				row.appendChild(toggle);
				row.appendChild(name);
				row.appendChild(colorButton);
				row.appendChild(colorInput);

				labelLegendBody.appendChild(row);
			}
		}

		async function loadLasPoints(url, options){
			const {pointLimit, readLimit, pointSize, chunkPoints, labelDefinitions} = options;

			const response = await fetch(url);
			if (!response.ok) {
				throw new Error(`Failed to fetch ${url}: ${response.status} ${response.statusText}`);
			}
			if (!response.body) {
				throw new Error("Streaming fetch is not available in this browser.");
			}

			const totalBytes = Number(response.headers.get("content-length") || "0");
			const reader = response.body.getReader();

			let pending = new Uint8Array(0);
			let bytesRead = 0;
			let header = null;
			let headerCandidate = null;
			let seenVertices = 0;
			let done = false;

			const pointCollector = createLabelPointCollector(chunkPoints, pointSize, labelDefinitions);
			const bounds = {
				minX: Number.POSITIVE_INFINITY,
				minY: Number.POSITIVE_INFINITY,
				minZ: Number.POSITIVE_INFINITY,
				maxX: Number.NEGATIVE_INFINITY,
				maxY: Number.NEGATIVE_INFINITY,
				maxZ: Number.NEGATIVE_INFINITY
			};

			let lastStatusAt = 0;
			function maybeUpdateStatus(force = false){
				const now = performance.now();
				if (!force && now - lastStatusAt < 200) {
					return;
				}
				lastStatusAt = now;

				const pct = totalBytes > 0 ? ` ${(bytesRead / totalBytes * 100).toFixed(1)}%` : "";
				const headerInfo = header
					? `LAS ${header.version} / fmt ${header.pointFormat} / record ${header.pointRecordLength}`
					: "LAS header: parsing";
				const declaredInfo = header && header.pointCount > 0 ? ` / header ${fmt.format(header.pointCount)}` : "";
				const renderMode = pointLimit > 0
					? `capped at ${fmt.format(pointLimit)}`
					: "full render";
				setStatus(
					`Reading ${url}${pct}\n` +
					`${headerInfo}\n` +
					`seen: ${fmt.format(seenVertices)}${declaredInfo}\n` +
					`rendered: ${fmt.format(pointCollector.getBufferedPoints())} (${renderMode})\n` +
					`labels: ${fmt.format(pointCollector.getLabelCount())}`
				);
			}

			while (!done) {
				const {value, done: streamDone} = await reader.read();
				if (streamDone) {
					break;
				}

				bytesRead += value.byteLength;
				pending = concatUint8(pending, value);

				if (!header) {
					if (!headerCandidate) {
						headerCandidate = parseLasHeader(pending);
					}

					if (headerCandidate && pending.length >= headerCandidate.offsetToPointData) {
						header = parseLasHeader(pending);

						if (!header || header.pointRecordLength <= 0) {
							throw new Error("Invalid LAS header: point record length is zero.");
						}

						if (header.pointFormat > 10) {
							throw new Error(`Unsupported LAS point format: ${header.pointFormat}`);
						}

						pending = pending.subarray(header.offsetToPointData);
					}
				}

				if (!header) {
					maybeUpdateStatus(false);
					continue;
				}

				const recordLength = header.pointRecordLength;
				const availableRecords = Math.floor(pending.length / recordLength);
				if (availableRecords === 0) {
					maybeUpdateStatus(false);
					continue;
				}

				const consumableBytes = availableRecords * recordLength;
				const recordBytes = pending.subarray(0, consumableBytes);
				const dv = new DataView(recordBytes.buffer, recordBytes.byteOffset, recordBytes.byteLength);
				const classificationOffset = getClassificationOffset(header.pointFormat);
				const withClassification = classificationOffset >= 0 && recordLength > classificationOffset;

				for (let recordIndex = 0; recordIndex < availableRecords; recordIndex++) {
					if (readLimit > 0 && seenVertices >= readLimit) {
						done = true;
						break;
					}

					if (pointLimit > 0 && pointCollector.getBufferedPoints() >= pointLimit) {
						done = true;
						break;
					}

					const base = recordIndex * recordLength;
					const xi = dv.getInt32(base + 0, true);
					const yi = dv.getInt32(base + 4, true);
					const zi = dv.getInt32(base + 8, true);

					const x = xi * header.scaleX + header.offsetX;
					const y = yi * header.scaleY + header.offsetY;
					const z = zi * header.scaleZ + header.offsetZ;
					const classification = withClassification ? dv.getUint8(base + classificationOffset, true) : 0;

					seenVertices++;
					pointCollector.appendPoint(x, y, z, classification);
					updateBounds(bounds, x, y, z);
				}

				pending = pending.subarray(consumableBytes);
				maybeUpdateStatus(false);
			}

			if (done) {
				await reader.cancel();
			}

			maybeUpdateStatus(true);

			if (!header) {
				throw new Error("LAS header was not parsed. File may be incomplete.");
			}

			const finalResult = pointCollector.finalize();
			if (finalResult.renderedPoints === 0) {
				throw new Error("No points were loaded from the LAS file.");
			}

			return {
				pointsGroup: finalResult.pointsGroup,
				bounds,
				header,
				seenVertices,
				renderedPoints: finalResult.renderedPoints,
				chunkCount: finalResult.chunkCount,
				fullyReadToEof: done === false,
				labels: finalResult.labelEntries
			};
		}

		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
		viewer.setEDLEnabled(false);
		viewer.setFOV(60);
		viewer.setPointBudget(10_000_000);
		viewer.setBackground("skybox");
		viewer.loadSettingsFromURL();

		viewer.setDescription(
			`Rendering ${samplePath}<br>` +
			`labelMap=${labelMapPath}<br>` +
			`maxPoints=${pointLimit > 0 ? fmt.format(pointLimit) : "all"}, ` +
			`maxReadPoints=${readLimit > 0 ? fmt.format(readLimit) : "all"}, ` +
			`chunkPoints=${fmt.format(chunkPoints)}`
		);

		viewer.loadGUI(() => {
			viewer.setLanguage("en");
			$("#menu_scene").next().show();
			$("#menu_appearance").next().show();
			viewer.toggleSidebar();
		});

		const ambient = new THREE.AmbientLight(0xffffff, 0.65);
		const directional = new THREE.DirectionalLight(0xffffff, 0.5);
		directional.position.set(10, 10, 15);
		viewer.scene.scene.add(ambient);
		viewer.scene.scene.add(directional);

		let latestBounds = null;

		topViewButton.addEventListener("click", () => {
			if (latestBounds) {
				applyTopView(viewer, latestBounds);
			}
		});

		try {
			setLabelPanelMeta(`Loading: ${labelMapPath}`);
			setLabelLegendMessage("Preparing label map...");
			const labelMapResult = await loadLabelDefinitions(labelMapPath);

			if (labelMapResult.loadedFromXml) {
				setLabelPanelMeta(
					`source: xml\n` +
					`path: ${labelMapResult.url}\n` +
					`definitions: ${fmt.format(labelMapResult.definitions.size)}`
				);
			} else {
				setLabelPanelMeta(
					`source: fallback\n` +
					`path: ${labelMapResult.url}\n` +
					`error: ${labelMapResult.errorMessage || "none"}`
				);
			}

			setStatus("Loading sample LAS...");

			const result = await loadLasPoints(samplePath, {
				pointLimit,
				readLimit,
				pointSize,
				chunkPoints,
				labelDefinitions: labelMapResult.definitions
			});

			viewer.scene.scene.add(result.pointsGroup);

			const basePlane = createPlane(result.bounds);
			viewer.scene.scene.add(basePlane);

			latestBounds = result.bounds;
			applyTopView(viewer, result.bounds);

			renderLabelLegend(result.labels);
			setLabelPanelMeta(
				`${labelMapResult.loadedFromXml ? "source: xml" : "source: fallback"}\n` +
				`labels rendered: ${fmt.format(result.labels.length)}\n` +
				`points rendered: ${fmt.format(result.renderedPoints)}`
			);

			const ranges = [
				`x: ${toRangeString(result.bounds.minX, result.bounds.maxX)}`,
				`y: ${toRangeString(result.bounds.minY, result.bounds.maxY)}`,
				`z: ${toRangeString(result.bounds.minZ, result.bounds.maxZ)}`
			];

			const fullMode = fullRenderMode && fullReadMode;
			const seenEqualsRendered = result.seenVertices === result.renderedPoints;
			const headerMatchesSeen = result.header.pointCount > 0
				? result.header.pointCount === result.seenVertices
				: null;

			setStatus(
				`Completed\n` +
				`LAS ${result.header.version} / format ${result.header.pointFormat} / record ${result.header.pointRecordLength}\n` +
				`seen: ${fmt.format(result.seenVertices)} / header ${fmt.format(result.header.pointCount)}\n` +
				`rendered: ${fmt.format(result.renderedPoints)} / chunks ${fmt.format(result.chunkCount)}\n` +
				`labels: ${fmt.format(result.labels.length)}\n` +
				`seen==rendered: ${seenEqualsRendered ? "yes" : "no"}` +
				(fullMode ? ` / fullMode: yes` : ` / fullMode: no`) +
				(headerMatchesSeen === null ? "" : ` / header==seen: ${headerMatchesSeen ? "yes" : "no"}`) +
				`\n${ranges.join(" | ")}`
			);
		} catch (error) {
			console.error(error);
			setStatus(`Failed: ${error.message}`);
			setLabelPanelMeta(`source: error\n${error.message}`);
			setLabelLegendMessage("Label controls unavailable due to load error.");
		}
	</script>
</body>
</html>
