<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Potree Sample LAS Top View</title>

	<link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">

	<style>
		#status_panel {
			position: absolute;
			top: 12px;
			left: 12px;
			z-index: 1000;
			max-width: 580px;
			padding: 10px 12px;
			background: rgba(0, 0, 0, 0.55);
			color: #fff;
			font: 12px/1.4 monospace;
			border-radius: 6px;
		}

		#btn_top_view {
			margin-top: 8px;
			padding: 4px 8px;
			cursor: pointer;
		}
	</style>
</head>

<body>
	<script src="../libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../libs/spectrum/spectrum.js"></script>
	<script src="../libs/jquery-ui/jquery-ui.min.js"></script>

	<script src="../libs/other/BinaryHeap.js"></script>
	<script src="../libs/tween/tween.min.js"></script>
	<script src="../libs/d3/d3.js"></script>
	<script src="../libs/proj4/proj4.js"></script>
	<script src="../libs/openlayers3/ol.js"></script>
	<script src="../libs/i18next/i18next.js"></script>
	<script src="../libs/jstree/jstree.js"></script>
	<script src="../build/potree/potree.js"></script>
	<script src="../libs/plasio/js/laslaz.js"></script>

	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0; top: 0;">
		<div id="potree_render_area" style="background-image: url('../build/potree/resources/images/background.jpg');"></div>
		<div id="potree_sidebar_container"></div>
	</div>

	<div id="status_panel">
		<div id="status_text">Initializing...</div>
		<button id="btn_top_view" type="button">Top View</button>
	</div>

	<script type="module">
		import * as THREE from "../libs/three.js/build/three.module.js";

		const params = new URLSearchParams(window.location.search);
		const samplePath = params.get("file") || "../data/sample.las";
		const maxPoints = Number(params.get("maxPoints") || "1200000");
		const maxReadPoints = Number(params.get("maxReadPoints") || "8000000");
		const pointSize = Number(params.get("pointSize") || "0.015");

		const statusText = document.getElementById("status_text");
		const topViewButton = document.getElementById("btn_top_view");

		const fmt = new Intl.NumberFormat("en-US");

		function setStatus(text){
			statusText.textContent = text;
		}

		function concatUint8(left, right){
			if (left.length === 0) return right;
			if (right.length === 0) return left;
			const out = new Uint8Array(left.length + right.length);
			out.set(left, 0);
			out.set(right, left.length);
			return out;
		}

		function updateBounds(bounds, x, y, z){
			if (x < bounds.minX) bounds.minX = x;
			if (y < bounds.minY) bounds.minY = y;
			if (z < bounds.minZ) bounds.minZ = z;
			if (x > bounds.maxX) bounds.maxX = x;
			if (y > bounds.maxY) bounds.maxY = y;
			if (z > bounds.maxZ) bounds.maxZ = z;
		}

		function toRangeString(minValue, maxValue){
			return `[${minValue.toFixed(3)}, ${maxValue.toFixed(3)}]`;
		}

		function applyTopView(viewer, bounds){
			const centerX = (bounds.minX + bounds.maxX) / 2;
			const centerY = (bounds.minY + bounds.maxY) / 2;
			const centerZ = (bounds.minZ + bounds.maxZ) / 2;
			const spanX = Math.max(1, bounds.maxX - bounds.minX);
			const spanY = Math.max(1, bounds.maxY - bounds.minY);
			const spanZ = Math.max(1, bounds.maxZ - bounds.minZ);
			const distance = Math.max(spanX, spanY, spanZ) * 2.2;

			viewer.scene.view.position.set(centerX, centerY, centerZ + distance);
			viewer.scene.view.lookAt(new THREE.Vector3(centerX, centerY, centerZ));
		}

		function createPlane(bounds){
			const width = Math.max(0.5, bounds.maxX - bounds.minX) * 1.1;
			const height = Math.max(0.5, bounds.maxY - bounds.minY) * 1.1;
			const centerX = (bounds.minX + bounds.maxX) / 2;
			const centerY = (bounds.minY + bounds.maxY) / 2;
			const planeZ = bounds.minZ - Math.max(0.01, (bounds.maxZ - bounds.minZ) * 0.05);

			const geometry = new THREE.PlaneGeometry(width, height);
			const material = new THREE.MeshBasicMaterial({
				color: 0x2b7a78,
				transparent: true,
				opacity: 0.35,
				side: THREE.DoubleSide
			});

			const plane = new THREE.Mesh(geometry, material);
			plane.position.set(centerX, centerY, planeZ);
			plane.name = "custom_base_plane";

			return plane;
		}

		function parseLasHeader(buffer){
			if (buffer.length < 106) {
				return null;
			}

			const dv = new DataView(buffer.buffer, buffer.byteOffset, buffer.byteLength);
			const signature = String.fromCharCode(buffer[0], buffer[1], buffer[2], buffer[3]);
			if (signature !== "LASF") {
				throw new Error("Invalid LAS signature. Expected LASF.");
			}

			const versionMajor = dv.getUint8(24);
			const versionMinor = dv.getUint8(25);
			const headerSize = dv.getUint16(94, true);
			const offsetToPointData = dv.getUint32(96, true);
			const pointFormatRaw = dv.getUint8(104);
			const pointFormat = pointFormatRaw & 0x3f;
			const pointRecordLength = dv.getUint16(105, true);
			const legacyPointCount = dv.getUint32(107, true);

			if (buffer.length < Math.max(offsetToPointData, 255)) {
				return {
					version: `${versionMajor}.${versionMinor}`,
					headerSize,
					offsetToPointData,
					pointFormat,
					pointRecordLength,
					pointCount: legacyPointCount,
					scaleX: 0.001,
					scaleY: 0.001,
					scaleZ: 0.001,
					offsetX: 0,
					offsetY: 0,
					offsetZ: 0
				};
			}

			const pointCount64 = Number(dv.getBigUint64(247, true));
			const scaleX = dv.getFloat64(131, true);
			const scaleY = dv.getFloat64(139, true);
			const scaleZ = dv.getFloat64(147, true);
			const offsetX = dv.getFloat64(155, true);
			const offsetY = dv.getFloat64(163, true);
			const offsetZ = dv.getFloat64(171, true);

			return {
				version: `${versionMajor}.${versionMinor}`,
				headerSize,
				offsetToPointData,
				pointFormat,
				pointRecordLength,
				pointCount: pointCount64 > 0 ? pointCount64 : legacyPointCount,
				scaleX,
				scaleY,
				scaleZ,
				offsetX,
				offsetY,
				offsetZ
			};
		}

		function formatHasRgb(pointFormat){
			return [2, 3, 5, 7, 8, 10].includes(pointFormat);
		}

		function toByteFromColor16(value){
			return Math.max(0, Math.min(255, Math.round(value / 256)));
		}

		async function loadLasSubset(url, options){
			const {maxPoints, maxReadPoints, pointSize} = options;

			const response = await fetch(url);
			if (!response.ok) {
				throw new Error(`Failed to fetch ${url}: ${response.status} ${response.statusText}`);
			}
			if (!response.body) {
				throw new Error("Streaming fetch is not available in this browser.");
			}

			const totalBytes = Number(response.headers.get("content-length") || "0");
			const reader = response.body.getReader();

			let pending = new Uint8Array(0);
			let bytesRead = 0;
			let header = null;
			let headerCandidate = null;
			let seenVertices = 0;
			let sampledVertices = 0;
			let done = false;

			const positions = new Float32Array(maxPoints * 3);
			const colors = new Uint8Array(maxPoints * 3);
			const bounds = {
				minX: Number.POSITIVE_INFINITY,
				minY: Number.POSITIVE_INFINITY,
				minZ: Number.POSITIVE_INFINITY,
				maxX: Number.NEGATIVE_INFINITY,
				maxY: Number.NEGATIVE_INFINITY,
				maxZ: Number.NEGATIVE_INFINITY
			};

			let lastStatusAt = 0;
			function maybeUpdateStatus(force = false){
				const now = performance.now();
				if (!force && now - lastStatusAt < 200) {
					return;
				}
				lastStatusAt = now;

				const pct = totalBytes > 0 ? ` ${(bytesRead / totalBytes * 100).toFixed(1)}%` : "";
				const headerInfo = header
					? `LAS ${header.version} / fmt ${header.pointFormat} / record ${header.pointRecordLength}`
					: "LAS header: parsing";
				const declaredInfo = header && header.pointCount > 0 ? ` / header ${fmt.format(header.pointCount)}` : "";
				setStatus(
					`Reading ${url}${pct}\n` +
					`${headerInfo}\n` +
					`seen: ${fmt.format(seenVertices)}${declaredInfo}\n` +
					`rendering: ${fmt.format(sampledVertices)} / cap ${fmt.format(maxPoints)}`
				);
			}

			while (!done) {
				const {value, done: streamDone} = await reader.read();
				if (streamDone) {
					break;
				}

				bytesRead += value.byteLength;
				pending = concatUint8(pending, value);

				if (!header) {
					if (!headerCandidate) {
						headerCandidate = parseLasHeader(pending);
					}

					if (headerCandidate && pending.length >= headerCandidate.offsetToPointData) {
						header = parseLasHeader(pending);

						if (!header || header.pointRecordLength <= 0) {
							throw new Error("Invalid LAS header: point record length is zero.");
						}

						if (header.pointFormat > 10) {
							throw new Error(`Unsupported LAS point format: ${header.pointFormat}`);
						}

						pending = pending.subarray(header.offsetToPointData);
					}
				}

				if (!header) {
					maybeUpdateStatus(false);
					continue;
				}

				const recordLength = header.pointRecordLength;
				const availableRecords = Math.floor(pending.length / recordLength);
				if (availableRecords === 0) {
					maybeUpdateStatus(false);
					continue;
				}

				const consumableBytes = availableRecords * recordLength;
				const recordBytes = pending.subarray(0, consumableBytes);
				const dv = new DataView(recordBytes.buffer, recordBytes.byteOffset, recordBytes.byteLength);
				const withRgb = formatHasRgb(header.pointFormat);

				for (let recordIndex = 0; recordIndex < availableRecords; recordIndex++) {
					if (maxReadPoints > 0 && seenVertices >= maxReadPoints) {
						done = true;
						break;
					}

					const base = recordIndex * recordLength;
					const xi = dv.getInt32(base + 0, true);
					const yi = dv.getInt32(base + 4, true);
					const zi = dv.getInt32(base + 8, true);

					const x = xi * header.scaleX + header.offsetX;
					const y = yi * header.scaleY + header.offsetY;
					const z = zi * header.scaleZ + header.offsetZ;

					let r = 255;
					let g = 255;
					let b = 255;

					if (withRgb && recordLength >= 36) {
						const r16 = dv.getUint16(base + 30, true);
						const g16 = dv.getUint16(base + 32, true);
						const b16 = dv.getUint16(base + 34, true);
						r = toByteFromColor16(r16);
						g = toByteFromColor16(g16);
						b = toByteFromColor16(b16);
					}

					seenVertices++;

					let targetIndex = -1;
					if (sampledVertices < maxPoints) {
						targetIndex = sampledVertices;
						sampledVertices++;
					} else {
						const replaceIndex = Math.floor(Math.random() * seenVertices);
						if (replaceIndex < maxPoints) {
							targetIndex = replaceIndex;
						}
					}

					if (targetIndex < 0) {
						continue;
					}

					updateBounds(bounds, x, y, z);

					const i3 = targetIndex * 3;
					positions[i3 + 0] = x;
					positions[i3 + 1] = y;
					positions[i3 + 2] = z;
					colors[i3 + 0] = r;
					colors[i3 + 1] = g;
					colors[i3 + 2] = b;
				}

				pending = pending.subarray(consumableBytes);
				maybeUpdateStatus(false);
			}

			if (done) {
				await reader.cancel();
			}

			maybeUpdateStatus(true);

			if (!header) {
				throw new Error("LAS header was not parsed. File may be incomplete.");
			}

			if (sampledVertices === 0) {
				throw new Error("No points were loaded from the LAS file.");
			}

			const drawPositions = positions.subarray(0, sampledVertices * 3);
			const drawColors = colors.subarray(0, sampledVertices * 3);

			const geometry = new THREE.BufferGeometry();
			geometry.setAttribute("position", new THREE.BufferAttribute(drawPositions, 3));
			geometry.setAttribute("color", new THREE.BufferAttribute(drawColors, 3, true));
			geometry.computeBoundingBox();
			geometry.computeBoundingSphere();

			const material = new THREE.PointsMaterial({
				size: pointSize,
				sizeAttenuation: true,
				vertexColors: true
			});
			const points = new THREE.Points(geometry, material);
			points.name = "sample_las_points";

			return {
				points,
				bounds,
				header,
				seenVertices,
				sampledVertices
			};
		}

		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
		viewer.setEDLEnabled(false);
		viewer.setFOV(60);
		viewer.setPointBudget(5_000_000);
		viewer.setBackground("skybox");
		viewer.loadSettingsFromURL();

		viewer.setDescription(
			`Rendering ${samplePath}<br>` +
			`maxPoints=${fmt.format(maxPoints)}, maxReadPoints=${fmt.format(maxReadPoints)}`
		);

		viewer.loadGUI(() => {
			viewer.setLanguage("en");
			$("#menu_scene").next().show();
			$("#menu_appearance").next().show();
			viewer.toggleSidebar();
		});

		const ambient = new THREE.AmbientLight(0xffffff, 0.65);
		const directional = new THREE.DirectionalLight(0xffffff, 0.5);
		directional.position.set(10, 10, 15);
		viewer.scene.scene.add(ambient);
		viewer.scene.scene.add(directional);

		let latestBounds = null;

		topViewButton.addEventListener("click", () => {
			if (latestBounds) {
				applyTopView(viewer, latestBounds);
			}
		});

		try {
			setStatus("Loading sample LAS...");

			const result = await loadLasSubset(samplePath, {
				maxPoints,
				maxReadPoints,
				pointSize
			});

			viewer.scene.scene.add(result.points);

			const basePlane = createPlane(result.bounds);
			viewer.scene.scene.add(basePlane);

			latestBounds = result.bounds;
			applyTopView(viewer, result.bounds);

			const ranges = [
				`x: ${toRangeString(result.bounds.minX, result.bounds.maxX)}`,
				`y: ${toRangeString(result.bounds.minY, result.bounds.maxY)}`,
				`z: ${toRangeString(result.bounds.minZ, result.bounds.maxZ)}`
			];

			setStatus(
				`Completed\n` +
				`LAS ${result.header.version} / format ${result.header.pointFormat} / record ${result.header.pointRecordLength}\n` +
				`seen: ${fmt.format(result.seenVertices)} / header ${fmt.format(result.header.pointCount)}\n` +
				`rendered: ${fmt.format(result.sampledVertices)}\n` +
				`${ranges.join(" | ")}`
			);
		} catch (error) {
			console.error(error);
			setStatus(`Failed: ${error.message}`);
		}
	</script>
</body>
</html>
